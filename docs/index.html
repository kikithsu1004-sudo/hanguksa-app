<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>그림으로 보는 한국사 — 초등 교과 연계</title>
<meta name="theme-color" content="#FBF2D9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="한국사">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--hanji:#FBF2D9;--hanji-deep:#F1E2B6;--meok:#22303F;--jjok:#2E4A8B;--jusa:#C8412B;--nok:#2F7A5A;--geum:#E0A526;--geum-light:#F6D77A;--line:#D9C89A}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;background:var(--hanji);color:var(--meok);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible{outline:3px solid var(--jjok);outline-offset:2px}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;padding:20px 18px 96px}
.screen.on{display:flex}
h1{font-size:25px;font-weight:800;letter-spacing:-.5px;line-height:1.2}
h2{font-size:19px;font-weight:800;letter-spacing:-.3px}
h3{font-size:15px;font-weight:800;margin:18px 0 8px}
.sub{color:#5B6675;font-size:14px;margin-top:4px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.back{width:40px;height:40px;border-radius:50%;background:var(--hanji-deep);font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pill{background:var(--meok);color:var(--hanji);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 홈 */
.unit{font-size:12px;font-weight:800;color:var(--jjok);margin:20px 0 8px;padding-left:10px;border-left:4px solid var(--jjok);line-height:1.3}
.chap{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:8px}
.chap .em{width:48px;height:48px;border-radius:14px;background:var(--hanji-deep);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.chap .nm{font-weight:800;font-size:15px}.chap .st{font-size:12px;color:#6B7684}
.chap.done{background:var(--geum-light);border-color:var(--geum)}.chap.done .em{background:var(--geum)}
.chap .sc{margin-left:auto;font-weight:800;font-size:13px;color:var(--nok);white-space:nowrap}

/* 장면 (애니메이션) */
.stage{background:#fff;border:2px solid var(--line);border-radius:22px;overflow:hidden}
.stage svg{width:100%;display:block}
.cap{padding:14px 16px 6px;font-size:15px;line-height:1.55}
.keypt{margin:8px 16px 14px;background:var(--hanji);border-left:4px solid var(--geum);border-radius:0 12px 12px 0;padding:8px 12px;font-size:13px;font-weight:700}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}.dots i.on{background:var(--jjok)}
.row{display:flex;gap:8px}
.cta{display:block;width:100%;padding:15px;border-radius:18px;background:var(--jusa);color:#fff;font-size:16px;font-weight:800;margin-top:10px}
.cta.blue{background:var(--jjok)}.cta.ghost{background:var(--hanji-deep);color:var(--meok)}
.cta:disabled{opacity:.35}

/* 애니메이션 */
svg [class^="a-"],svg [class*=" a-"]{transform-box:fill-box;transform-origin:center}
.a-spin{animation:spin 12s linear infinite}
.a-flicker{animation:flick 1.1s ease-in-out infinite alternate}
.a-bob{animation:bob 1.6s ease-in-out infinite}
.a-bob2{animation:bob 1.6s ease-in-out .5s infinite}
.a-sway{animation:sway 2.4s ease-in-out infinite;transform-origin:bottom center}
.a-float{animation:floaty 2.6s ease-in-out infinite}
.a-rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.a-pop{animation:pop .6s cubic-bezier(.2,.8,.2,1) both}
.a-drop{animation:drop 1.6s cubic-bezier(.3,1.4,.4,1) both}
.a-slide{animation:slide 4s linear infinite}
.a-slide2{animation:slide2 3s ease-in-out infinite alternate}
.a-wave{animation:wave 1s ease-in-out infinite alternate;transform-origin:left center}
.a-gallop{animation:gallop .5s ease-in-out infinite alternate}
.a-lift{animation:lift 2.2s ease-in-out infinite alternate}
.a-dance{animation:dance 1s ease-in-out infinite alternate}
.a-dash{animation:dash 1.2s linear infinite}
.a-down{animation:down 1.6s ease-out both}
.a-in{animation:inleft 1.6s ease-out 1.2s both}
.d1{animation-delay:.35s!important}.d2{animation-delay:.7s!important}.d3{animation-delay:1.05s!important}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flick{from{opacity:.6;transform:scale(.95)}to{opacity:1;transform:scale(1.05)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-6px) rotate(1deg)}}
@keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes drop{from{transform:translateY(-70px)}to{transform:none}}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(40px)}}
@keyframes slide2{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
@keyframes wave{from{transform:skewY(-6deg)}to{transform:skewY(6deg)}}
@keyframes gallop{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-6px) rotate(2deg)}}
@keyframes lift{from{transform:translateY(0)}to{transform:translateY(-34px)}}
@keyframes dance{from{transform:rotate(-8deg) translateY(0)}to{transform:rotate(8deg) translateY(-6px)}}
@keyframes dash{to{stroke-dashoffset:-32}}
@keyframes down{from{opacity:0;transform:translateY(-40px)}to{opacity:1;transform:none}}
@keyframes inleft{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){svg *{animation:none!important}}

/* 정리 */
.term{display:flex;gap:10px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:6px;font-size:14px}
.term b{color:var(--jjok);white-space:nowrap;min-width:84px}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:3px;background:var(--line)}
.tl div{position:relative;margin-bottom:8px;font-size:14px}
.tl div::before{content:"";position:absolute;left:-20px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--geum);border:2px solid #fff}
.tl b{color:var(--jusa);margin-right:6px}

/* 퀴즈 */
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.qdots{display:flex;gap:6px}.qdots i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}
.qdots i.ok{background:var(--nok)}.qdots i.no{background:var(--jusa)}
.qbox{background:#fff;border-radius:20px;padding:18px;border:2px solid var(--line)}
.qbox .q{font-size:17px;font-weight:800;line-height:1.4;margin-bottom:14px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px;font-weight:700;margin-bottom:8px}
.opt .n{width:24px;height:24px;border-radius:50%;background:var(--hanji-deep);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.opt.ok{border-color:var(--nok);background:#E4F3EB}.opt.no{border-color:var(--jusa);background:#FBE5E0}
.reply{background:var(--geum-light);border-radius:14px;padding:12px 14px;font-size:14px;margin-top:6px;animation:rise .3s}
.score{background:var(--meok);color:var(--hanji);border-radius:22px;padding:22px;text-align:center}
.score .big{font-size:40px;font-weight:800;color:var(--geum-light)}

/* 리포트 */
.rep{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px}
.rep .r1{display:flex;justify-content:space-between;font-weight:800;font-size:14px}
.rep .r2{font-size:13px;color:#5B6675;margin-top:4px}
.bar{height:8px;border-radius:4px;background:var(--hanji-deep);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--nok)}

nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:2px solid var(--line);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:#8A93A0;padding:6px 0;border-radius:12px}
nav button span{font-size:22px}nav button.on{color:var(--jjok);background:#EEF2FA}

/* 말풍선 · 안내자 */
.talk{display:flex;gap:10px;align-items:flex-start;padding:12px 14px 4px}
.talk .av{width:46px;height:46px;border-radius:50%;flex-shrink:0;background:var(--geum);display:flex;align-items:center;justify-content:center;overflow:hidden}
.talk .av svg{width:46px;height:46px}
.talk .bub{background:var(--hanji);border-radius:4px 18px 18px 18px;padding:10px 14px;font-size:15px;line-height:1.55;flex:1}
.talk .who{font-size:11px;font-weight:800;color:var(--jusa);margin-bottom:2px}
.ask{background:var(--meok);color:var(--hanji);border-radius:22px;padding:18px}
.ask .q{font-size:16px;font-weight:800;line-height:1.5;margin-bottom:12px}
.ask .opt{background:#fff;color:var(--meok)}
.ask .reply{color:var(--meok)}
.stage svg.scene{filter:saturate(1.08)}
.short input{width:100%;font:inherit;font-size:16px;padding:13px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;margin-bottom:8px}
.short input:focus{outline:none;border-color:var(--jjok)}
.modal{position:fixed;inset:0;background:rgba(34,48,63,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
.modal .box{background:var(--hanji);border-radius:24px;padding:24px 20px;max-width:360px;width:100%}
.modal input{width:100%;font:inherit;font-size:18px;padding:14px;border:2px solid var(--line);border-radius:14px;background:#fff;margin:12px 0 4px}
.cheer{display:inline-block;background:var(--geum-light);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:800;margin-bottom:10px}

.wallet{background:linear-gradient(150deg,var(--meok),#3A4B66);color:var(--hanji);border-radius:24px;padding:22px 20px;position:relative;overflow:hidden}
.wallet::after{content:"₩";position:absolute;right:-6px;bottom:-30px;font-size:120px;font-weight:800;opacity:.08}
.wallet .amt{font-size:38px;font-weight:800;color:var(--geum-light);letter-spacing:-1px}
.wallet .lbl{font-size:13px;color:#BFC7D3}
.log{display:flex;justify-content:space-between;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:6px;font-size:14px}
.log .d{font-size:11px;color:#8A93A0}
.log b.plus{color:var(--nok)} .log b.minus{color:var(--jusa)} .log b.wait{color:var(--geum)}
.pend{background:var(--geum-light);border:2px solid var(--geum);border-radius:18px;padding:14px 16px;margin-bottom:10px}
.pin{display:flex;gap:8px;margin:8px 0}
.pin input{flex:1;font:inherit;font-size:20px;letter-spacing:8px;text-align:center;padding:12px;border:2px solid var(--line);border-radius:14px;background:#fff}
.set{display:flex;align-items:center;justify-content:space-between;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:6px;font-size:14px}
.set input{width:90px;font:inherit;font-size:15px;text-align:right;padding:6px 8px;border:2px solid var(--line);border-radius:10px}
.celebrate{background:var(--geum-light);border:2px solid var(--geum);border-radius:22px;padding:18px;text-align:center;margin-top:12px;animation:pop .5s cubic-bezier(.2,.8,.2,1)}
.celebrate .big{font-size:34px}

.ios{background:var(--meok);color:var(--hanji);border-radius:18px;padding:12px 14px;font-size:13px;margin-bottom:12px;display:flex;gap:10px;align-items:center}
.ios b{color:var(--geum-light)}
.ios button{margin-left:auto;font-weight:800;color:#BFC7D3}
</style>
</head>
<body>
<div id="app">
<section class="screen on" id="s-home">
  <h1>그림으로 보는 한국사</h1>
  <p class="sub">초등 사회 교과서 순서 그대로 · 장면으로 보고 문제로 확인</p>
  <div id="home"></div>
</section>
<section class="screen" id="s-scene">
  <div class="top"><button class="back" onclick="go('home')">←</button><span class="pill" id="sc-title"></span></div>
  <div class="stage" id="stage"></div>
  <div class="dots" id="sc-dots"></div>
  <div class="row"><button class="cta ghost" id="sc-prev" onclick="scene(-1)">◀ 이전</button><button class="cta blue" id="sc-next" onclick="scene(1)">다음 장면 ▶</button></div>
</section>
<section class="screen" id="s-summary">
  <div class="top"><button class="back" onclick="go('home')">←</button><span class="pill" id="sm-title"></span></div>
  <div id="summary"></div>
</section>
<section class="screen" id="s-quiz">
  <div class="top"><button class="back" onclick="go('home')">←</button><span class="pill" id="qz-title"></span></div>
  <div id="quiz"></div>
</section>
<section class="screen" id="s-exam">
  <h1>모의고사</h1>
  <p class="sub">배운 단원 전체에서 10문제를 섞어 내요. 시험 전 점검용!</p>
  <div id="exam" style="margin-top:14px"></div>
</section>
<section class="screen" id="s-wallet">
  <h1>내 지갑</h1>
  <p class="sub">모의고사 100점이면 가상 캐시가 쌓여요</p>
  <div id="wallet" style="margin-top:14px"></div>
</section>
<section class="screen" id="s-report">
  <h1>부모님 리포트</h1>
  <p class="sub">단원별 점수와 틀린 문제를 확인하세요</p>
  <div id="report" style="margin-top:14px"></div>
</section>
<nav>
  <button class="on" data-t="home" onclick="go('home')"><span>📚</span>챕터</button>
  <button data-t="exam" onclick="go('exam')"><span>✏️</span>모의고사</button>
  <button data-t="wallet" onclick="go('wallet')"><span>💰</span>지갑</button>
  <button data-t="report" onclick="go('report')"><span>📊</span>부모님</button>
</nav>
</div>
<script>
// ===== 그림 부품 (SVG) =====
const DEFS=`<defs>
<linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9CCBE8"/><stop offset="1" stop-color="#EAF4F9"/></linearGradient>
<linearGradient id="gNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151D2B"/><stop offset="1" stop-color="#3A4B66"/></linearGradient>
<linearGradient id="gWarm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7D9A8"/><stop offset="1" stop-color="#FBF2D9"/></linearGradient>
<linearGradient id="gGrass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9CCB84"/><stop offset="1" stop-color="#5E9A3C"/></linearGradient>
<linearGradient id="gDirt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D9B77A"/><stop offset="1" stop-color="#A67C52"/></linearGradient>
<linearGradient id="gSea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FC3E3"/><stop offset="1" stop-color="#3D7BB0"/></linearGradient>
<linearGradient id="gStone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B7BCC2"/><stop offset="1" stop-color="#6E747A"/></linearGradient>
<radialGradient id="gGlow"><stop offset="0" stop-color="#FFF3B0" stop-opacity=".9"/><stop offset="1" stop-color="#FFF3B0" stop-opacity="0"/></radialGradient>
<filter id="paper" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 0.35 0 0 0 0 0.28 0 0 0 0 0.18 0 0 0 .18 0"/></filter>
<filter id="soft"><feGaussianBlur stdDeviation=".4"/></filter>
</defs>`;
const GRAD={'#DCEFF7':'url(#gSky)','#22303F':'url(#gNight)','#FBF2D9':'url(#gWarm)','#8FBF7A':'url(#gGrass)','#C9A66B':'url(#gDirt)','#7FB3D5':'url(#gSea)','#5B94BE':'url(#gSea)','#F4ECD6':'url(#gWarm)','#E7D3B2':'url(#gWarm)','#F1E6D0':'url(#gWarm)','#EEF5EA':'url(#gSky)','#C9CFD6':'url(#gStone)','#8A9096':'url(#gStone)','#E8DFC0':'url(#gDirt)','#7A5230':'url(#gDirt)'};
const g=c=>GRAD[c]||c;
const P = {
  bg:(sky,ground)=>`<rect width="340" height="200" fill="${g(sky)}"/>${sky==='#22303F'?'':`<g class="a-slide"><ellipse cx="150" cy="30" rx="26" ry="9" fill="#fff" opacity=".8"/><ellipse cx="168" cy="26" rx="16" ry="8" fill="#fff" opacity=".8"/><ellipse cx="250" cy="52" rx="22" ry="8" fill="#fff" opacity=".7"/></g>`}<rect y="142" width="340" height="58" fill="${g(ground)}"/><path d="M0 142 q40 -6 80 0 t80 0 t80 0 t80 0 t40 0 v6 h-360z" fill="${g(ground)}" opacity=".6"/>`,
  sun:(x,y)=>`<g transform="translate(${x},${y})"><circle r="40" fill="url(#gGlow)"/><g class="a-spin"><circle r="16" fill="#F6D77A"/><g stroke="#F6D77A" stroke-width="3" stroke-linecap="round">${[0,45,90,135].map(a=>`<line x1="-24" x2="24" transform="rotate(${a})"/>`).join('')}</g></g></g>`,
  hill:(x,w,h,c)=>`<path d="M${x-w/2} 142 Q${x-w/4} ${142-h*.7} ${x} ${142-h} Q${x+w/4} ${142-h*.7} ${x+w/2} 142Z" fill="${c}"/><path d="M${x-w/2} 142 Q${x-w/4} ${142-h*.7} ${x} ${142-h} Q${x+w/6} ${142-h*.8} ${x+w/3} ${142-h*.4}" stroke="#fff" stroke-opacity=".25" stroke-width="3" fill="none"/>`,
  person:(x,y,c,cls='',hat='')=>`<g transform="translate(${x},${y})"><ellipse cy="26" rx="12" ry="3" fill="#000" opacity=".15"/><g class="${cls}"><path d="M-8 -18 q8 -16 16 0z" fill="#3A2A22"/><circle cy="-21" r="8.5" fill="#F6D2B0"/><path d="M-8.5 -23 q8.5 -12 17 0" fill="#3A2A22"/><circle cx="-3" cy="-21" r="1.3" fill="#22303F"/><circle cx="3" cy="-21" r="1.3" fill="#22303F"/><path d="M-2.5 -17.5 q2.5 2 5 0" stroke="#22303F" stroke-width="1" fill="none"/><circle cx="-5.5" cy="-18" r="1.6" fill="#F4A8A0" opacity=".6"/><circle cx="5.5" cy="-18" r="1.6" fill="#F4A8A0" opacity=".6"/>${hat}<path d="M-10 -12 q10 -4 20 0 v12 q-10 3 -20 0z" fill="${c}"/><path d="M-3 -12 l3 8 l3 -8" stroke="#fff" stroke-opacity=".7" stroke-width="1.2" fill="none"/><path d="M-11 -10 l-4 12 M11 -10 l4 12" stroke="${c}" stroke-width="4" stroke-linecap="round"/><path d="M-9 0 h18 l2 12 h-22z" fill="${c}" opacity=".85"/><path d="M-6 12 v11 M6 12 v11" stroke="#3A2A22" stroke-width="4" stroke-linecap="round"/></g></g>`,
  gat:`<path d="M-12 -29 h24 l-3 -8 h-18z M-8 -37 h16" stroke="#111" stroke-width="2" fill="#111"/><path d="M-12 -29 h24" stroke="#444" stroke-width="1"/>`,
  crown:`<path d="M-9 -29 L-6 -37 L0 -31 L6 -37 L9 -29Z" fill="#E0A526"/><circle cx="0" cy="-33" r="1.5" fill="#C8412B"/>`,
  label:(x,y,t,c='#22303F')=>`<text x="${x}" y="${y}" font-size="11" font-weight="800" text-anchor="middle" fill="${c}" stroke="${c==='#fff'?'#22303F':'#FBF2D9'}" stroke-width="3" paint-order="stroke" stroke-linejoin="round">${t}</text>`,

const KEY='hanguksa_v2';
let S={seen:{},res:{},cur:null,name:'',cash:null};
const defCash=()=>({balance:0,log:[],pending:null,pin:'',reward:500,lastEarn:''});
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&typeof x==='object'){S.seen=x.seen||{};S.res=x.res||{};S.name=x.name||'';S.cash=Object.assign(defCash(),x.cash||{});}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({seen:S.seen,res:S.res,name:S.name,cash:S.cash}));}catch(e){}}
function resetAll(){if(confirm('학습 기록을 모두 지울까요?')){S={seen:{},res:{},cur:null,name:'',cash:defCash()};try{localStorage.removeItem(KEY)}catch(e){};go('home');askName();}}
load(); if(!S.cash) S.cash=defCash();
const fill=t=>t.replace(/\{name\}/g,S.name||'친구');
const chById=id=>CH.find(c=>c.id===id);

function go(t,ch){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  if(ch) S.cur=ch;
  ({home:renderHome,scene:()=>startScenes(ch),summary:renderSummary,quiz:startQuiz,exam:renderExam,wallet:renderWallet,report:renderReport})[t]();
  document.getElementById('s-'+t).classList.add('on'); window.scrollTo(0,0);
}
function askName(){
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="box"><div class="talk" style="padding:0 0 8px"><div class="av">${GUIDE}</div><div class="bub"><div class="who">호야 선생님</div>안녕! 나는 한국사 안내자 호야야. 너를 뭐라고 부르면 좋을까?</div></div><input id="nm" placeholder="이름 또는 별명" maxlength="8"><button class="cta" onclick="setName()">시작하기</button></div>`;
  document.body.appendChild(m); setTimeout(()=>document.getElementById('nm').focus(),50);
  window.setName=()=>{S.name=document.getElementById('nm').value.trim()||'친구'; save(); m.remove(); renderHome();};
}
function renderHome(){
  const h=document.getElementById('home');
  const n=Object.keys(S.res).filter(k=>k!=='exam').length;
  h.innerHTML=`<div class="talk" style="padding:14px 0 6px"><div class="av">${GUIDE}</div><div class="bub"><div class="who">호야 선생님</div>${n?fill(`{name}, 벌써 ${n}개 챕터를 끝냈네! 오늘은 어디로 가볼까?`):fill('{name}, 교과서 순서대로 가볼까? 궁금한 챕터부터 골라도 좋아.')}</div></div>`+

}

// ----- 장면 흐름 (장면 + 대화 질문) -----
let flow=[],fi=0;
function startScenes(ch){
  S.cur=ch; fi=0; flow=[];
  const ask=ASKS[ch.id];
  SCENES[ch.id].forEach((s,i)=>{flow.push({type:'scene',s}); if(ask&&ask.after===i) flow.push({type:'ask',a:ask});});
  document.getElementById('sc-title').textContent=`${ch.emoji} ${ch.title}`; drawStep();
}
function drawStep(){
  const st=flow[fi], stage=document.getElementById('stage');
  if(st.type==='scene'){
    stage.className='stage';
    stage.innerHTML=`<svg class="scene" viewBox="0 0 340 200" xmlns="http://www.w3.org/2000/svg">${DEFS}${st.s.svg}<rect width="340" height="200" fill="none" filter="url(#paper)" style="mix-blend-mode:multiply" pointer-events="none"/></svg><div class="talk"><div class="av">${GUIDE}</div><div class="bub"><div class="who">호야 선생님</div>${fill(st.s.cap)}</div></div><div class="keypt">📌 ${st.s.key}</div>`;
    document.getElementById('sc-next').disabled=false;
  } else {
    stage.className='';
    stage.innerHTML=`<div class="ask"><div class="talk" style="padding:0 0 10px"><div class="av">${GUIDE}</div><div class="bub" style="background:#fff;color:var(--meok)"><div class="who">호야 선생님</div>${fill(st.a.q)}</div></div>${st.a.o.map((o,i)=>`<button class="opt" onclick="askPick(${i})"><span class="n">${i+1}</span><span>${o}</span></button>`).join('')}<div id="askreply"></div></div>`;
    document.getElementById('sc-next').disabled=true;
  }
  const scenes=flow.filter(f=>f.type==='scene'); const sIdx=flow.slice(0,fi+1).filter(f=>f.type==='scene').length-1;
  document.getElementById('sc-dots').innerHTML=scenes.map((_,i)=>`<i class="${i===sIdx?'on':''}"></i>`).join('');
  document.getElementById('sc-prev').disabled=fi===0;
  const last=fi===flow.length-1, nb=document.getElementById('sc-next');
  nb.textContent=last?'핵심 정리 보기 ✨':'다음 ▶'; nb.onclick=last?()=>{S.seen[S.cur.id]=true;save();go('summary')}:()=>scene(1);
}
function askPick(i){
  const a=flow[fi].a; document.querySelectorAll('.ask .opt').forEach((b,k)=>{b.disabled=true; if(k===i) b.classList.add(a.a<0||a.a===i?'ok':'no'); if(a.a>=0&&k===a.a) b.classList.add('ok');});
  document.getElementById('askreply').innerHTML=`<div class="reply">${fill(a.r[i])}</div>`;
  document.getElementById('sc-next').disabled=false;
}
function scene(d){ fi=Math.max(0,Math.min(flow.length-1,fi+d)); drawStep(); window.scrollTo(0,0); }

let Q=[],qi=0,qr=[],qmode='chapter';
const norm=s=>(s||'').toString().toLowerCase().replace(/[\s·.\-]/g,'');
function startQuiz(){ qmode='chapter'; Q=S.cur.quiz.map(q=>({...q,ch:S.cur.id})); qi=0; qr=[]; document.getElementById('qz-title').textContent=`✏️ ${S.cur.title} 확인 문제`; renderQ('quiz'); }
function renderQ(target){
  if(qi>=Q.length) return finishQuiz(target);
  const q=Q[qi];
  const body=q.t==='short'
    ?`<div class="short"><input id="sa" placeholder="답을 써 보세요" autocomplete="off" onkeydown="if(event.key==='Enter')answerShort('${target}')"><button class="cta blue" onclick="answerShort('${target}')">제출</button></div>`
    :q.o.map((o,i)=>`<button class="opt" onclick="answer(${i},'${target}')"><span class="n">${i+1}</span><span>${o}</span></button>`).join('');
  document.getElementById(target).innerHTML=`<div class="qhead"><span class="pill">${qi+1} / ${Q.length} ${q.t==='short'?'· 주관식':''}</span><div class="qdots">${Q.map((_,i)=>`<i class="${qr[i]===true?'ok':qr[i]===false?'no':''}"></i>`).join('')}</div></div>
   <div class="qbox"><div class="q">${q.q}</div>${body}<div id="qreply"></div></div>`;
  if(q.t==='short') setTimeout(()=>document.getElementById('sa').focus(),50);
}
function showReply(ok,target,q,extra=''){
  qr[qi]=ok;
  document.getElementById('qreply').innerHTML=`<div class="reply"><b>${ok?'정답! ':'아쉬워요. '}</b>${extra}${q.e}</div><button class="cta blue" onclick="qi++;renderQ('${target}')">${qi+1<Q.length?'다음 문제':'결과 보기'}</button>`;
}
function answer(i,target){
  const q=Q[qi], ok=i===q.a;
  document.querySelectorAll('#'+target+' .opt').forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add('ok');if(k===i&&!ok)b.classList.add('no');});
  showReply(ok,target,q);
}
function answerShort(target){
  const q=Q[qi], inp=document.getElementById('sa'), v=inp.value; if(!v.trim()) return;
  const ok=q.ans.some(a=>norm(a)===norm(v)); inp.disabled=true; inp.style.borderColor=ok?'var(--nok)':'var(--jusa)';
  document.querySelector('#'+target+' .short .cta').disabled=true;
  showReply(ok,target,q,ok?'':`정답은 <b>${q.ans[0]}</b>. `);
}
function finishQuiz(target){
  const score=qr.filter(Boolean).length,total=Q.length;
  const wrong=Q.filter((_,i)=>!qr[i]).map(q=>({ch:q.ch,q:q.q}));
  if(qmode==='chapter') S.res[S.cur.id]={score,total,wrong}; else S.res.exam={score,total,wrong,at:new Date().toLocaleDateString('ko-KR')};
  save();
  const msg=score===total?'완벽해! 시험 준비 끝.':score>=total*0.7?'잘했어. 틀린 것만 다시 보면 돼.':'장면을 다시 보고 한 번 더 풀어보자.';
  document.getElementById(target).innerHTML=`<div class="score"><div class="big">${score} / ${total}</div><div>${fill('{name}, ')+msg}</div></div>${bonus}
   ${wrong.length?`<h3>다시 볼 내용</h3>${wrong.map(w=>`<div class="term"><b>${chById(w.ch).title}</b><span>${w.q}</span></div>`).join('')}`:''}
   <button class="cta" onclick="go('home')">챕터 목록으로</button>
   ${qmode==='chapter'?`<button class="cta ghost" onclick="go('scene',S.cur)">장면 다시 보기</button>`:`<button class="cta ghost" onclick="renderExam()">다시 풀기</button>`}`;
}

// ----- 모의고사 -----
function renderExam(){
  const ex=document.getElementById('exam');
  ex.innerHTML=`<div class="talk" style="padding:0 0 12px"><div class="av">${GUIDE}</div><div class="bub"><div class="who">호야 선생님</div>${fill('{name}, 시험 전 실전 연습! 범위를 고르면 객관식 8 + 주관식 4, 총 12문제를 섞어 낼게.')}</div></div>
   <div class="row"><button class="cta blue" onclick="startExam('5')">5학년 2학기</button><button class="cta blue" onclick="startExam('6')">6학년</button></div><button class="cta" onclick="startExam('all')">전체 범위</button>`;
}
function startExam(range){
  const ids=range==='5'?[1,2,3,4,5,6,7]:range==='6'?[8,9,10,11]:CH.map(c=>c.id);
  const pool=CH.filter(c=>ids.includes(c.id)).flatMap(c=>c.quiz.map(q=>({...q,ch:c.id})));
  const sh=a=>a.sort(()=>Math.random()-.5);
  qmode='exam'; Q=[...sh(pool.filter(q=>!q.t)).slice(0,8),...sh(pool.filter(q=>q.t)).slice(0,4)]; qi=0; qr=[]; renderQ('exam');
}

// ----- 지갑 -----
const won=n=>n.toLocaleString('ko-KR')+'원';
function renderWallet(){
  const c=S.cash, w=document.getElementById('wallet');
  const tip={earn:['plus','+'],req:['wait','요청 중 '],paid:['minus','-'],reject:['minus','취소 ']};
  w.innerHTML=`<div class="wallet"><div class="lbl">${S.name||'내'} 가상 캐시</div><div class="amt">${won(c.balance)}</div><div class="lbl">모의고사 100점 = ${won(c.reward)} (하루 1회)</div></div>
   ${c.pending?`<div class="pend">📨 부모님께 <b>${won(c.pending.amt)}</b> 용돈 요청을 보냈어요. 부모님 탭에서 확인해 주시면 지급돼요.</div>`
   :`<button class="cta" ${c.balance<=0?'disabled':''} onclick="requestCash()">부모님께 용돈으로 요청하기</button>`}
   <h3>기록</h3>${c.log.length?c.log.slice(0,30).map(l=>`<div class="log"><div>${l.note}<div class="d">${l.at}</div></div><b class="${tip[l.t][0]}">${tip[l.t][1]}${l.t==='reject'?'':won(l.amt)}</b></div>`).join(''):'<p class="sub">아직 기록이 없어요. 모의고사 100점에 도전해 봐요!</p>'}`;
}
function requestCash(){
  const c=S.cash; let v=prompt(`얼마를 요청할까요? (최대 ${won(c.balance)})`, c.balance); if(v===null) return;
  v=parseInt(String(v).replace(/[^0-9]/g,''),10); if(!v||v<=0||v>c.balance) return alert('금액을 다시 확인해 주세요.');
  c.pending={amt:v,at:new Date().toLocaleDateString('ko-KR')}; c.log.unshift({t:'req',amt:v,at:c.pending.at,note:'용돈 요청'}); save(); renderWallet();
}
let parentOK=false;
function parentGate(){
  const c=S.cash;
  if(parentOK) return true;
  if(!c.pin){ const p=prompt('부모님 비밀번호(숫자 4자리)를 처음 설정합니다.'); if(!p||!/^\d{4}$/.test(p)) return false; c.pin=p; save(); parentOK=true; return true; }
  const p=prompt('부모님 비밀번호 4자리'); if(p===c.pin){parentOK=true;return true;} alert('비밀번호가 달라요.'); return false;
}
function parentAction(kind){
  if(!parentGate()) return; const c=S.cash, p=c.pending; if(!p) return;
  const at=new Date().toLocaleDateString('ko-KR');
  if(kind==='pay'){ c.balance-=p.amt; c.log.unshift({t:'paid',amt:p.amt,at,note:'용돈 지급 완료 ✓'}); }
  else c.log.unshift({t:'reject',amt:p.amt,at,note:'요청 보류 (캐시는 그대로)'});
  c.pending=null; save(); renderReport();
}
function parentSettings(){
  if(!parentGate()) return; const c=S.cash;
  const r=prompt('모의고사 100점 보상 금액(원)',c.reward); if(r!==null&&parseInt(r)>=0){c.reward=parseInt(r)||0;}
  const p=prompt('비밀번호 변경 (그대로 두려면 취소)'); if(p&&/^\d{4}$/.test(p)) c.pin=p;
  save(); renderReport();
}
// ----- 리포트 -----
function renderReport(){
  const done=CH.filter(c=>S.res[c.id]); const weak=done.filter(c=>S.res[c.id].score<S.res[c.id].total*0.7);
  let html=`<div class="rep" style="background:var(--meok);color:var(--hanji);border-color:var(--meok)"><div class="r1"><span>${S.name||'학생'} 학습 진도</span><span>${done.length} / ${CH.length} 챕터</span></div><div class="r2" style="color:#BFC7D3">${weak.length?'복습 추천: '+weak.map(c=>c.title).join(', '):done.length?'모든 챕터 70% 이상 정답.':'아직 시작 전이에요.'}</div>${S.res.exam?`<div class="r2" style="color:#F6D77A">최근 모의고사 ${S.res.exam.score}/${S.res.exam.total} (${S.res.exam.at})</div>`:''}</div>`;
  html+=UNITS.map(u=>`<div class="unit">${u.name}</div>`+u.ch.map(id=>{const c=chById(id),x=S.res[id];
    if(!x) return `<div class="rep"><div class="r1"><span>${c.emoji} ${c.title}</span><span style="color:#8A93A0">${S.seen[id]?'장면만 봄':'미학습'}</span></div></div>`;
    return `<div class="rep"><div class="r1"><span>${c.emoji} ${c.title}</span><span>${x.score}/${x.total}</span></div><div class="bar"><i style="width:${x.score/x.total*100}%"></i></div>${x.wrong.length?`<div class="r2">틀린 문제: ${x.wrong.map(w=>w.q).join(' / ')}</div>`:''}</div>`}).join('')).join('');
  const c=S.cash;
  html=`<div class="unit">용돈 보상</div>${c.pending?`<div class="pend">📨 ${S.name||'아이'}가 <b>${won(c.pending.amt)}</b> 용돈을 요청했어요 (${c.pending.at})<div class="row"><button class="cta blue" onclick="parentAction('pay')">지급 완료</button><button class="cta ghost" onclick="parentAction('hold')">보류</button></div></div>`:`<div class="rep"><div class="r1"><span>가상 캐시 잔액</span><span>${won(c.balance)}</span></div><div class="r2">대기 중인 요청 없음 · 보상 ${won(c.reward)}/100점, 하루 1회</div></div>`}<button class="cta ghost" onclick="parentSettings()">보상 금액 · 비밀번호 설정</button>`+html;
  html+=`<button class="cta ghost" onclick="resetAll()">기록 초기화 / 이름 바꾸기</button>`;
  document.getElementById('report').innerHTML=html;
}
// PWA (아이폰: Safari 공유 → 홈 화면에 추가)
try{ if('serviceWorker' in navigator && location.protocol==='https:' && !location.host.includes('androidplatform')) navigator.serviceWorker.register('sw.js'); }catch(e){}
(function(){
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent), standalone=window.navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
  let hidden=false; try{hidden=localStorage.getItem('ios_tip')==='1'}catch(e){}
  if(ios&&!standalone&&!hidden){ const d=document.createElement('div'); d.className='ios'; d.innerHTML=`📲 <span>아이폰은 <b>공유 버튼 <svg width="12" height="14" viewBox="0 0 12 14" style="vertical-align:-2px"><path d="M6 1v8M3 4l3-3 3 3M2 7v6h8V7" stroke="#F6D77A" stroke-width="1.5" fill="none"/></svg> → 홈 화면에 추가</b>를 누르면 앱처럼 쓸 수 있어요</span><button onclick="this.parentNode.remove();try{localStorage.setItem('ios_tip','1')}catch(e){}">닫기</button>`;
    document.getElementById('s-home').insertBefore(d,document.getElementById('home')); }
})();
renderHome(); if(!S.name) askName();
</script></body></html>
